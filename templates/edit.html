<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Part — MechTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/inventory" class="logo">MechTrack</a>
    <div class="nav-right">
        <span class="nav-user">{{ session['username'] }}</span>
        <a href="/logout" class="nav-logout">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Edit Part</h1>
        <a href="/inventory" class="btn btn-ghost">← Back</a>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label>Part Name</label>
                <input type="text" name="name" value="{{ part['name'] }}" required autofocus>
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" value="{{ part['quantity'] }}" min="0" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category">
                    <option value="">— Select Category —</option>
                    {% set categories = ['Brakes', 'Engine', 'Filters', 'Electrical', 'Suspension', 'Transmission', 'Exhaust', 'Cooling', 'Other'] %}
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if part['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Part Type</label>
                <select name="part_type" required>
                    <option value="OEM" {% if part['part_type'] == 'OEM' %}selected{% endif %}>OEM</option>
                    <option value="Aftermarket" {% if part['part_type'] == 'Aftermarket' %}selected{% endif %}>
                        Aftermarket
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Brand</label>
                <input type="text" name="brand" value="{{ part['brand'] or '' }}" placeholder="e.g. Bosch, NGK, Brembo">
            </div>

            <div class="form-group">
                <label>Serial Number</label>
                <input type="number" name="serial_number" value="{{ part['serial_number'] or '' }}"
                       placeholder="Optional">
            </div>

            <div class="form-group">
                <label>Price (₺)</label>
                <input type="number" name="price" value="{{ part['price'] }}" min="0" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Low Stock Threshold</label>
                <input type="number" name="threshold" value="{{ part['low_stock_threshold'] }}" min="0" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/inventory" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
